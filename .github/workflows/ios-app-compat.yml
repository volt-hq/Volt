name: iOS app compatibility

# Holds pull requests that can break the Volt iOS build recorded in
# .github/ios-app-baseline.json. See "iOS app compatibility" in AGENTS.md.
# Kept out of ci.yml so label changes rerun only this check.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ios-app-compat-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ios-app-compat:
    name: iOS app compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Detect app-facing changes
        id: detect
        run: node scripts/ios-app-compat.mjs --base HEAD^1

      - name: Require a compatibility decision
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          APP_FACING: ${{ steps.detect.outputs.app-facing }}
          BREAKS: ${{ contains(github.event.pull_request.labels.*.name, 'breaks-ios-app') }}
          CHECKED: ${{ contains(github.event.pull_request.labels.*.name, 'ios-compat-checked') }}
        run: |
          if [ "$BREAKS" = true ]; then
            echo "::error::Labeled breaks-ios-app. Hold until a Volt iOS build that supports this change is released, then update .github/ios-app-baseline.json and remove the label."
            exit 1
          fi
          if [ "$APP_FACING" != true ] || [ "$CHECKED" = true ]; then
            exit 0
          fi
          # Label only on code changes, so removing the label before adding
          # ios-compat-checked does not put it back.
          if [ "$ACTION" != labeled ] && [ "$ACTION" != unlabeled ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label breaks-ios-app \
              || echo "::warning::Could not add the breaks-ios-app label."
          fi
          echo "::error::This pull request changes what the Volt iOS baseline build depends on (see the step above). If that build keeps working, label it ios-compat-checked; otherwise leave breaks-ios-app until a supporting build is released."
          exit 1
