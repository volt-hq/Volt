name: iOS app compatibility

# Holds pull requests that can break the Volt iOS build recorded in
# .github/ios-app-baseline.json. See "iOS app compatibility" in AGENTS.md.
# Kept out of ci.yml so label changes rerun only this check.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A run that records an ios-compat-checked decision is never cancelled, so the
# decision cannot be lost; other runs for the pull request replace each other.
concurrency:
  group: ios-app-compat-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name == 'ios-compat-checked') && format('-decision-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions: {}

jobs:
  ios-app-compat:
    name: iOS app compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Require a compatibility decision for app-facing changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ios-app-compat.mjs --base HEAD^1 --gate
