name: Build Workspace FS Prebuilds

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Exact lowercase 40-character SHA of the selected workflow branch/tag'
        required: true
        type: string

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ inputs.commit }}
    steps:
      - name: Require the exact dispatched source commit
        shell: bash
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || [[ "$SOURCE_COMMIT" != "$GITHUB_SHA" ]]; then
            echo 'Select the source branch/tag and supply its exact commit SHA' >&2
            exit 1
          fi
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Confirm source identity
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

  build:
    needs: validate
    name: Build and verify (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            rust-target: aarch64-apple-darwin
            runner: macos-15
          - target: darwin-x64
            rust-target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: linux-arm64-gnu
            rust-target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: linux-arm64-musl
            rust-target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: linux-x64-gnu
            rust-target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: linux-x64-musl
            rust-target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: win32-arm64-msvc
            rust-target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: win32-x64-msvc
            rust-target: x86_64-pc-windows-msvc
            runner: windows-2025
    env:
      SOURCE_COMMIT: ${{ inputs.commit }}
      WORKSPACE_FS_TARGET: ${{ matrix.target }}
      RUST_TARGET: ${{ matrix.rust-target }}
      # musl cdylibs and test executables must use the dynamic musl runtime.
      RUSTFLAGS: ${{ endsWith(matrix.target, '-musl') && '-C target-feature=-crt-static' || '' }}
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Setup Node.js 22.19
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Setup pinned Rust toolchain
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain 1.97.1 "$RUST_TARGET"
      - name: Install native-architecture musl linker and runtime
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Format, lint, and test the target crate
        shell: bash
        run: |
          cd packages/coding-agent/native/workspace-fs
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --target "$RUST_TARGET" -- -D warnings
          cargo test --locked --target "$RUST_TARGET"
      - name: Build fresh target addon
        shell: bash
        run: node scripts/workspace-fs-native.mjs build "$WORKSPACE_FS_TARGET"
      - name: Load and stage native addon
        if: ${{ !endsWith(matrix.target, '-musl') }}
        shell: bash
        env:
          UPLOAD_DIRECTORY: ${{ runner.temp }}/native-upload
        run: node scripts/workspace-fs-prebuilds.mjs stage "$WORKSPACE_FS_TARGET" "$UPLOAD_DIRECTORY" "$SOURCE_COMMIT"
      - name: Load and stage musl addon using Node.js 22.19 on Alpine
        if: endsWith(matrix.target, '-musl')
        shell: bash
        env:
          NODE_IMAGE: node:22.19.0-alpine@sha256:d2166de198f26e17e5a442f537754dd616ab069c47cc57b889310a717e0abbf9
          OUTPUT_ROOT: ${{ runner.temp }}
        run: |
          docker pull "$NODE_IMAGE"
          docker run --rm --pull=never \
            --volume "${PWD}:/workspace:ro" \
            --volume "${OUTPUT_ROOT}:/output" \
            --workdir /workspace \
            --env SOURCE_COMMIT --env WORKSPACE_FS_TARGET \
            "$NODE_IMAGE" sh -ec '
              apk add --no-cache git
              git config --global --add safe.directory /workspace
              test "$(node --version)" = v22.19.0
              node scripts/workspace-fs-prebuilds.mjs stage "$WORKSPACE_FS_TARGET" /output/native-upload "$SOURCE_COMMIT"
            '
      - name: Upload only the verified target and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-fs-prebuild-${{ matrix.target }}
          path: ${{ runner.temp }}/native-upload/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ inputs.commit }}
      INPUT_DIRECTORY: ${{ runner.temp }}/native-inputs
      OUTPUT_DIRECTORY: ${{ runner.temp }}/native-bundle
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Setup Node.js 22.19
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Setup pinned Rust metadata tooling
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Download target artifacts from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: workspace-fs-prebuild-*
          path: ${{ env.INPUT_DIRECTORY }}
          merge-multiple: false
      - name: Regenerate license inventory and assemble exact target set
        run: |
          node scripts/workspace-fs-native.mjs licenses
          node scripts/workspace-fs-prebuilds.mjs assemble "$INPUT_DIRECTORY" "$OUTPUT_DIRECTORY" "$SOURCE_COMMIT"
          cd "$OUTPUT_DIRECTORY"
          sha256sum -c SHA256SUMS
      - name: Upload review bundle
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-fs-native-${{ inputs.commit }}
          path: ${{ env.OUTPUT_DIRECTORY }}/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Summarize manual review inputs
        env:
          ARTIFACT_DIGEST: ${{ steps.bundle.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.bundle.outputs.artifact-url }}
        run: |
          {
            echo '## Workspace filesystem native prebuilds'
            printf '\nSource commit: `%s`\n' "$SOURCE_COMMIT"
            printf '\nArtifact digest: `%s`\n' "$ARTIFACT_DIGEST"
            printf '\n[Download the reviewed-input bundle](%s)\n' "$ARTIFACT_URL"
            echo
            echo 'Verify source-commit.txt and SHA256SUMS, then review and commit only the bundled prebuilds and licenses. This workflow does not commit, push, or publish.'
          } >> "$GITHUB_STEP_SUMMARY"
