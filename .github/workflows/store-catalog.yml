name: Store catalog

# Validates site/public/store/catalog.json against the packages it pins.
# Read-only: no secrets, a read-only token, and no package code is run. The
# check fetches each pinned commit with git and reads it as data.
on:
  pull_request:
    branches: [main]
    paths:
      - site/public/store/catalog.json
      - scripts/validate-store-catalog.mjs
      - scripts/validate-store-catalog.test.mjs
      - .github/workflows/store-catalog.yml
      - packages/coding-agent/src/store/catalog.ts
      - packages/coding-agent/src/core/extensions/manifest.ts
      - packages/protocol/src/extensions.ts

concurrency:
  group: store-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The merge commit and its first parent, the base branch the catalog is compared against.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Install npm 11.17.0
        working-directory: ${{ runner.temp }}
        run: npm install -g npm@11.17.0 --ignore-scripts

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test the catalog validator
        run: node --conditions=volt-source --test scripts/validate-store-catalog.test.mjs

      - name: Validate the catalog against its pinned packages
        run: node --conditions=volt-source scripts/validate-store-catalog.mjs --base-ref HEAD^1
