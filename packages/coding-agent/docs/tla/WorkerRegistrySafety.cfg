\* Safety variant for WorkerRegistry.tla: three worker ids
\*   ./check.sh WorkerRegistry WorkerRegistrySafety.cfg
\*
\* The baseline's bounds with a third worker id (the bounds the model was
\* checked at before shared workers: spawn, replacement, and a further
\* replacement), every safety invariant and action property, and no
\* liveness (its state space is about seven times the baseline's).

SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    Workers = {w1, w2, w3}
    Clients = {c1, c2}
    Senders = {c1}
    Keys = {k1}
    NoWorker = NoWorker
    NoSession = NoSession
    NoKey = NoKey
    Cap = 2
    MaxFaults = 1
    MaxGen = 1
    RestartWaitsForOrphans = TRUE

INVARIANT
    TypeOK
    OneHost
    OneWriter
    LockCoherent
    ReadyHoldsLocks
    RetireWhenEmpty
    GroupsWellFormed
    CapRespected
    AttachOnlyToLive
    NoOfferToRetiring
    CloseOnlyDetached
    NoLostInput
    ExactlyOnce
    RetireOnlyDetachedIdle
    NoGenerationOverlap

PROPERTY
    OfferAdmittedOnce
    ClaimRespectsHost
    RouteRespectsKey
    CloseScoped
    FencedWorkersInert
    RetireReportsAfterExit
