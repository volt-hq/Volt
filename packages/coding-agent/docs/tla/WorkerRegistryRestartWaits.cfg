\* Proposed-fix variant for WorkerRegistry.tla
\*   ./check.sh WorkerRegistry WorkerRegistryRestartWaits.cfg
\*
\* RestartWaitsForOrphans = TRUE: a restarted daemon admits nothing until the
\* dead daemon's workers have exited (for example, every worker holds a shared
\* lock the daemon takes exclusively before it serves).  The baseline plus the
\* two workspace authority predicates the baseline leaves off.

SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    Workers = {w1, w2, w3}
    Clients = {c1, c2}
    Senders = {c1}
    NoWorker = NoWorker
    NoSession = NoSession
    MaxFaults = 1
    MaxGen = 1
    RestartWaitsForOrphans = TRUE

INVARIANT
    TypeOK
    OneHost
    OneWriter
    LockCoherent
    ReadyHoldsLocks
    AttachOnlyToLive
    NoOfferToRetiring
    NoLostInput
    ExactlyOnce
    RetireOnlyDetachedIdle
    NoGenerationOverlap

PROPERTY
    OfferAdmittedOnce
    ClaimRespectsHost
    FencedWorkersInert
    RetireReportsAfterExit
    OpenServed
    RetiringExits
    StartingSettles
    DetachedIdleRetires
    OrphansExit
    WorkspaceRetireCompletes
