\* Safety variant for WorkerRegistry.tla: sharing under a binding cap
\*   ./check.sh WorkerRegistry WorkerRegistrySharing.cfg
\*
\* The baseline bounds cannot fill a worker (two sessions, a cap of two) or
\* open with differing keys.  Here three sessions and two compatibility keys
\* let opens share a worker until its cap, spawn beside a full one, and never
\* share across keys (RouteRespectsKey), with every safety invariant and
\* action property of the baseline.  One client reaches every case (it
\* detaches, opens again with another key, or is redirected to another
\* session); one fault, and no fence (the baseline covers fences).  Safety
\* only (no liveness).

SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2, s3}
    Workers = {w1, w2, w3}
    Clients = {c1}
    Senders = {}
    Keys = {k1, k2}
    NoWorker = NoWorker
    NoSession = NoSession
    NoKey = NoKey
    Cap = 2
    MaxFaults = 1
    MaxGen = 0
    RestartWaitsForOrphans = TRUE

INVARIANT
    TypeOK
    OneHost
    OneWriter
    LockCoherent
    ReadyHoldsLocks
    RetireWhenEmpty
    GroupsWellFormed
    CapRespected
    AttachOnlyToLive
    NoOfferToRetiring
    CloseOnlyDetached
    NoLostInput
    ExactlyOnce
    RetireOnlyDetachedIdle
    NoGenerationOverlap

PROPERTY
    OfferAdmittedOnce
    ClaimRespectsHost
    RouteRespectsKey
    CloseScoped
    FencedWorkersInert
    RetireReportsAfterExit
