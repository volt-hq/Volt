\* Bug-finding variant for WorkerRegistry.tla
\*   ./check.sh WorkerRegistry WorkerRegistryOrphans.cfg
\*
\* The plan's original design (RestartWaitsForOrphans = FALSE: a restarted
\* daemon does not wait for the dead daemon's workers) with the two workspace
\* authority predicates that it does not satisfy.  TLC reports
\* RetireReportsAfterExit first, in seven states:
\*   RequestOpen -> Spawn -> DaemonCrash -> DaemonRestart -> FenceWorkspace ->
\*   WorkspaceRetired
\* The dead daemon's worker (an orphan) belongs to the fenced generation, but
\* the restarted daemon's registry is empty, so the mutation reports success
\* and readmits the workspace while that process still runs (workspace
\* authority RFC W4/W5).  With WorkerOpen -> WorkerReady -> TurnStart before
\* the crash, the same steps leave an orphan running a turn (up to 60 s) in the
\* fenced workspace.  NoGenerationOverlap fails as soon as the new generation
\* spawns a worker.
\* The baseline WorkerRegistry.cfg checks the adopted fix
\* (RestartWaitsForOrphans = TRUE).  Safety only.

SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    Workers = {w1, w2, w3}
    Clients = {c1, c2}
    Senders = {c1}
    Keys = {k1}
    NoWorker = NoWorker
    NoSession = NoSession
    NoKey = NoKey
    Cap = 2
    MaxFaults = 1
    MaxGen = 1
    RestartWaitsForOrphans = FALSE

INVARIANT
    TypeOK
    NoGenerationOverlap

PROPERTY
    RetireReportsAfterExit
