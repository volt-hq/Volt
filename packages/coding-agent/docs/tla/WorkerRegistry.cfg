\* TLC configuration for WorkerRegistry.tla
\*   ./check.sh WorkerRegistry
\*
\* GREEN BASELINE: the Phase 7 worker registry as implemented
\* (RestartWaitsForOrphans = TRUE: a restarted daemon admits nothing until the
\* dead daemon's workers have exited; every worker holds a shared lock on the
\* daemon's worker gate, which the daemon takes exclusively before it serves).
\* All invariants, the action properties, and the liveness properties.
\*
\* Bounds: two sessions, three worker ids (never reused), two clients of which
\* one sends an input id, one fault (worker crash, offer expiry, or daemon
\* crash), and one workspace fence.  Symmetry is off because the run checks
\* liveness.
\*
\* WorkerRegistryOrphans.cfg keeps the trace that motivated the restart wait
\* (RestartWaitsForOrphans = FALSE).

SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    Workers = {w1, w2, w3}
    Clients = {c1, c2}
    Senders = {c1}
    NoWorker = NoWorker
    NoSession = NoSession
    MaxFaults = 1
    MaxGen = 1
    RestartWaitsForOrphans = TRUE

INVARIANT
    TypeOK
    OneHost
    OneWriter
    LockCoherent
    ReadyHoldsLocks
    AttachOnlyToLive
    NoOfferToRetiring
    NoLostInput
    ExactlyOnce
    RetireOnlyDetachedIdle
    NoGenerationOverlap

PROPERTY
    OfferAdmittedOnce
    ClaimRespectsHost
    FencedWorkersInert
    RetireReportsAfterExit
    OpenServed
    RetiringExits
    StartingSettles
    DetachedIdleRetires
    OrphansExit
    WorkspaceRetireCompletes
