\* TLC configuration for WorkerRegistry.tla
\*   ./check.sh WorkerRegistry
\*
\* GREEN BASELINE: the Phase 7 worker registry as the plan designs it
\* (RestartWaitsForOrphans = FALSE: a restarted daemon does not wait for the
\* dead daemon's workers).  All invariants, the action properties, and the
\* liveness properties.
\*
\* Bounds: two sessions, three worker ids (never reused), two clients of which
\* one sends an input id, one fault (worker crash, offer expiry, or daemon
\* crash), and one workspace fence.  Symmetry is off because the run checks
\* liveness.
\*
\* Two predicates stay OFF here; the plan's design does not satisfy them:
\*   RetireReportsAfterExit, NoGenerationOverlap -- an orphan of a dead daemon
\*   can outlive a workspace mutation the restarted daemon reports done.
\*   WorkerRegistryOrphans.cfg shows the trace; WorkerRegistryRestartWaits.cfg
\*   checks the proposed fix.

SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    Workers = {w1, w2, w3}
    Clients = {c1, c2}
    Senders = {c1}
    NoWorker = NoWorker
    NoSession = NoSession
    MaxFaults = 1
    MaxGen = 1
    RestartWaitsForOrphans = FALSE

INVARIANT
    TypeOK
    OneHost
    OneWriter
    LockCoherent
    ReadyHoldsLocks
    AttachOnlyToLive
    NoOfferToRetiring
    NoLostInput
    ExactlyOnce
    RetireOnlyDetachedIdle
\*  NoGenerationOverlap      \* <-- fails: orphan of a dead daemon (see header)

PROPERTY
    OfferAdmittedOnce
    ClaimRespectsHost
    FencedWorkersInert
\*  RetireReportsAfterExit   \* <-- fails: orphan of a dead daemon (see header)
    OpenServed
    RetiringExits
    StartingSettles
    DetachedIdleRetires
    OrphansExit
    WorkspaceRetireCompletes
