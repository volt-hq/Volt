\* TLC configuration for WorkerRegistry.tla
\*   ./check.sh WorkerRegistry
\*
\* GREEN BASELINE: the Phase 7 worker registry as implemented, with shared
\* workers (D11 revised, slice 7b) and the restart wait
\* (RestartWaitsForOrphans = TRUE: a restarted daemon admits nothing until the
\* dead daemon's workers have exited; every worker holds a shared lock on the
\* daemon's worker gate, which the daemon takes exclusively before it serves).
\* All invariants, the action properties, and the liveness properties.
\*
\* Bounds: two sessions, two worker ids (never reused), two clients of which
\* one sends an input id, one compatibility key (every open may share), a cap
\* of two top-level conversations per worker (so both sessions can share
\* one), one fault (worker crash, offer expiry, daemon crash, or forced close
\* of one conversation), and one workspace fence.  Symmetry is off because
\* the run checks liveness.  With sharing the state space is larger than the
\* pre-sharing model's, so the liveness run keeps two worker ids;
\* WorkerRegistrySafety.cfg checks safety with three.
\*
\* WorkerRegistrySharing.cfg checks safety with differing keys and a binding
\* cap (three sessions, two keys); WorkerRegistryOrphans.cfg keeps the trace
\* that motivated the restart wait (RestartWaitsForOrphans = FALSE).

SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    Workers = {w1, w2}
    Clients = {c1, c2}
    Senders = {c1}
    Keys = {k1}
    NoWorker = NoWorker
    NoSession = NoSession
    NoKey = NoKey
    Cap = 2
    MaxFaults = 1
    MaxGen = 1
    RestartWaitsForOrphans = TRUE

INVARIANT
    TypeOK
    OneHost
    OneWriter
    LockCoherent
    ReadyHoldsLocks
    RetireWhenEmpty
    GroupsWellFormed
    CapRespected
    AttachOnlyToLive
    NoOfferToRetiring
    CloseOnlyDetached
    NoLostInput
    ExactlyOnce
    RetireOnlyDetachedIdle
    NoGenerationOverlap

PROPERTY
    OfferAdmittedOnce
    ClaimRespectsHost
    RouteRespectsKey
    CloseScoped
    FencedWorkersInert
    RetireReportsAfterExit
    OpenServed
    RetiringExits
    StartingSettles
    DetachedIdleCloses
    ClosesSettle
    OrphansExit
    WorkspaceRetireCompletes
